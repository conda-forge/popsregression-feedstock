schema_version: 1

context:
  name: POPSregression
  version: "0.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/popsregression-${{ version }}.tar.gz
  sha256: 9bd6055400de03e81da7830b1d079f554ae3dcae3e08b2bac5916e5a7f749f0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - scikit-learn >=1.6.1
    - scipy >=1.6.0
    - numpy >=1.20.0
    - jax

tests:
  - python:
      imports:
        - POPSRegression
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Bayesian regression for low-noise data using POPS algorithm
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tomswinburne/POPS-Regression

extra:
  recipe-maintainers:
    - tomswinburne
    - jan-janssen
